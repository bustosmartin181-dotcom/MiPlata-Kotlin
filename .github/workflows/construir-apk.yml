name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Probar el motor de cálculo contra la app original
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Preparar la clave de firma fija
        env:
          CLAVE_B64: ${{ secrets.MIPLATA_KEYSTORE }}
        run: |
          if [ -z "$CLAVE_B64" ]; then echo "::error::Falta el secreto MIPLATA_KEYSTORE"; exit 1; fi
          echo "$CLAVE_B64" | base64 -d > "$RUNNER_TEMP/miplata.keystore"
          echo "MIPLATA_KEYSTORE=$RUNNER_TEMP/miplata.keystore" >> "$GITHUB_ENV"

      - name: Construir el APK
        env:
          MIPLATA_CLAVE: ${{ secrets.MIPLATA_CLAVE }}
        run: ./gradlew :app:assembleRelease

      - name: Ponerle nombre con la versión
        run: cp app/build/outputs/apk/release/app-release.apk "MiPlataK-10.0.${{ github.run_number }}.apk"

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlataK-APK
          path: MiPlataK-*.apk
