name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Probar el motor de cálculo (las dos versiones)
        run: |
          chmod +x gradlew
          ./gradlew :app:testPersonalDebugUnitTest :app:testPublicaDebugUnitTest

      - name: Preparar la clave de firma fija
        env:
          CLAVE_B64: ${{ secrets.MIPLATA_KEYSTORE }}
        run: |
          # Sin el secreto se firma con una clave de prueba (puede pedir desinstalar al actualizar)
          if [ -z "$CLAVE_B64" ]; then echo "::warning::Sin clave fija: se firma con clave de prueba"; exit 0; fi
          echo "$CLAVE_B64" | base64 -d > "$RUNNER_TEMP/miplata.keystore"
          echo "MIPLATA_KEYSTORE=$RUNNER_TEMP/miplata.keystore" >> "$GITHUB_ENV"

      - name: Construir los APK (personal y pública)
        env:
          MIPLATA_CLAVE: ${{ secrets.MIPLATA_CLAVE }}
        run: ./gradlew :app:assemblePersonalRelease :app:assemblePublicaRelease

      - name: Ponerles nombre con la versión
        run: |
          cp app/build/outputs/apk/personal/release/app-personal-release.apk "MiPlata-10.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/publica/release/app-publica-release.apk "MiPlata-Publica-1.0.${{ github.run_number }}.apk"

      - name: Subir el APK personal
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-APK
          path: MiPlata-10.0.*.apk

      - name: Subir el APK público
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-Publica-APK
          path: MiPlata-Publica-*.apk

      - name: Publicar los APK como versión descargable
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0.${{ github.run_number }}
          name: Mi plata 10.0.${{ github.run_number }}
          body: |
            MiPlata-10.0.x.apk: tu versión personal (se instala encima de la anterior).
            MiPlata-Publica-1.0.x.apk: la versión para la gente (es otra app: se instala aparte).
          files: |
            MiPlata-10.0.*.apk
            MiPlata-Publica-*.apk
